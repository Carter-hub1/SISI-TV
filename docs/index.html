<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>SISI TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2322d3c5'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' text-anchor='middle' fill='%230b0f17'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#home" aria-label="SISI TV home">SISI<span>TV</span></a>
    <nav class="tabs">
      <a href="#home" data-tab="home">Home</a>
      <a href="#movies" data-tab="movies">Films</a>
      <a href="#series" data-tab="series">Series</a>
      <a href="#settings" data-tab="settings">Settings</a>
    </nav>
    <form class="search" id="searchForm" role="search">
      <input id="searchBox" type="search" placeholder="Search films and series" autocomplete="off">
    </form>
    <button class="party-btn" id="partyBtn" title="Watch party">👥 <span id="partyLabel">Party</span></button>
  </header>

  <main id="view"></main>

  <!-- details, sources, dialogs -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <button class="sheet-close" id="sheetClose" aria-label="Close">✕</button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- player -->
  <div class="player" id="player" hidden>
    <video id="video" playsinline controls crossorigin="anonymous"></video>
    <div class="player-bar" id="playerBar">
      <button id="pBack" class="pbtn">✕ Close</button>
      <div class="ptitle" id="pTitle"></div>
      <button id="pSubs" class="pbtn">Subtitles</button>
      <button id="pCompat" class="pbtn" title="Use Real-Debrid's browser-friendly stream">Compatible stream</button>
      <button id="pParty" class="pbtn">👥 Party</button>
    </div>
    <div class="pmsg" id="pMsg" hidden></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="vendor/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
